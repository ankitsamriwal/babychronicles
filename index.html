<style>
:root{
  --cream:#FAF4E8; --cream2:#F3EAD9; --paper:#FFFDF8; --ink:#2E2A24; --ink2:#6B6357;
  --terra:#C4673F; --terra-soft:#E8C4AE; --sage:#7E9274; --sage-soft:#DDE5D6;
  --gold:#C89B5A; --rose:#C98A7A; --line:rgba(46,42,36,.12);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:#E9E0CF;font-family:var(--sans);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
body.care{--terra:#7E9274;--terra-soft:#DDE5D6;--cream:#F2F4EC;--cream2:#E7EBDD;--rose:#9BAF92}
#phone{width:100%;max-width:430px;min-height:100vh;background:var(--cream);position:relative;box-shadow:0 0 60px rgba(46,42,36,.25);overflow:hidden}
@media(min-width:500px){#phone{margin:24px 0;border-radius:36px;min-height:calc(100vh - 48px)}}
.screen{padding:24px 22px 110px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,.serif{font-family:var(--serif)}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:8px}
body.care .eyebrow{color:var(--sage)}
.h-display{font-size:2rem;font-weight:400;line-height:1.15}
.h-display em{font-style:italic;color:var(--terra)}
.lede{color:var(--ink2);font-size:.95rem;line-height:1.6;margin-top:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px}
.card.dark{background:var(--ink);color:var(--cream);border:none}
.btn{display:block;width:100%;padding:16px;border-radius:999px;border:none;font-family:var(--sans);font-size:.95rem;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-terra{background:var(--terra);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;margin-top:22px}
.btn-row .btn{margin:0}
.mt{margin-top:22px}
input[type=text],input[type=date],input[type=password],input[type=number],textarea,select{
  width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);
  font-family:var(--sans);font-size:.95rem;color:var(--ink);margin-top:8px}
textarea{min-height:110px;resize:vertical;line-height:1.55}
label.f{display:block;font-size:.78rem;font-weight:600;color:var(--ink2);margin-top:18px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:.85rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip.terra.on{background:var(--terra);border-color:var(--terra);color:#fff}
/* bottom nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(255,253,248,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:50}
#nav button{background:none;border:none;font-size:.62rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--sans);font-weight:500}
#nav button.on{color:var(--terra)}
#nav button svg{width:22px;height:22px}
body.cinema #nav{background:rgba(23,20,16,.94);border-top-color:rgba(239,231,214,.14)}
body.cinema #nav button{color:#8A8172}
body.cinema #nav button.on{color:var(--gold)}
body.cinema #nav .fab{border-color:#171410}
#nav .fab{width:52px;height:52px;border-radius:50%;background:var(--terra);color:#fff;font-size:1.5rem;margin-top:-26px;box-shadow:0 8px 20px rgba(196,103,63,.4);display:flex;align-items:center;justify-content:center;border:3px solid var(--cream)}
body.care #nav .fab{background:var(--sage);box-shadow:0 8px 20px rgba(126,146,116,.4)}
/* hero */
.hero{position:relative;border-radius:26px;background:linear-gradient(160deg,#FFF8EA,#F6E7CF);border:1px solid var(--line);padding:26px 24px;overflow:hidden;margin-top:14px}
.hero .ringwrap{position:absolute;right:18px;top:18px}
.hero h2,.hero>p{max-width:calc(100% - 122px)}
.ring{transform:rotate(-90deg)}
.ring .bg{stroke:var(--cream2)}
.ring .fg{stroke:var(--terra);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
body.care .ring .fg{stroke:var(--sage)}
.sizeviz{font-family:var(--serif);font-size:3.2rem;line-height:1;margin:14px 0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 16px;cursor:pointer;text-align:left;transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.tile .ic{width:38px;height:38px;border-radius:12px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:10px}
.tile b{display:block;font-size:.9rem}
.tile span{font-size:.72rem;color:var(--ink2);line-height:1.4;display:block;margin-top:3px}
.tile.locked .ic{background:var(--ink);color:var(--gold)}
.moment{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.moment:last-child{border:none}
.moment .thumb{width:56px;height:56px;border-radius:14px;background:var(--cream2);flex:none;display:flex;align-items:center;justify-content:center;font-size:1.3rem;overflow:hidden}
.moment .thumb img{width:100%;height:100%;object-fit:cover}
.moment .mm{min-width:0}
.moment .mm b{font-size:.88rem;display:block}
.moment .mm small{color:var(--ink2);font-size:.72rem}
.moment .mm p{font-size:.8rem;color:var(--ink2);margin-top:3px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;font-size:.62rem;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:#4E5F46;font-weight:600;margin-right:5px;letter-spacing:.04em}
.tag.t{background:var(--terra-soft);color:#8A4526}
.pillrow{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pillrow::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:.8rem;cursor:pointer;color:var(--ink2)}
.pill.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
/* timeline spine */
.spine{position:relative;margin-top:10px;padding-left:26px}
.spine:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--terra-soft),var(--sage-soft))}
.node{position:relative;padding:0 0 22px}
.node:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--terra);border:3px solid var(--cream);box-shadow:0 0 0 1px var(--terra-soft)}
.node .nd{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.node .nc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:6px}
.node .nc b{font-size:.88rem;font-family:var(--serif);font-weight:500}
.node .nc p{font-size:.8rem;color:var(--ink2);margin-top:4px;line-height:1.5}
/* story */
.story{background:#171410;color:#EFE7D6;min-height:100vh;margin:-24px -22px -110px;padding:70px 30px 130px}
.story .kicker{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.story h1{font-size:2.6rem;font-weight:300;line-height:1.1;margin-top:14px}
.story h1 em{font-style:italic;color:var(--terra-soft)}
.chapter{margin-top:56px}
.chapter .cnum{font-family:var(--serif);font-size:.85rem;color:var(--gold);letter-spacing:.2em}
.chapter h2{font-size:1.7rem;font-weight:400;margin-top:8px}
.chapter p{font-size:.95rem;line-height:1.85;color:#CFC4AE;margin-top:14px;font-weight:300}
.chapter .shots{display:flex;gap:10px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.chapter .shots::-webkit-scrollbar{display:none}
.chapter .shots img{height:150px;border-radius:14px;flex:none}
.chapter .shots .ph{height:150px;width:110px;flex:none;border-radius:14px;background:#241F18;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.divider{width:44px;height:1px;background:var(--gold);margin:46px auto 0;opacity:.6}
.seg{display:flex;background:var(--cream2);border-radius:999px;padding:4px;margin-top:16px}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--ink2);cursor:pointer;font-family:var(--sans)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(46,42,36,.1)}
.listrow{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.listrow:last-child{border:none}
.listrow .ic{width:40px;height:40px;border-radius:12px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
.listrow b{font-size:.9rem;display:block}
.listrow small{color:var(--ink2);font-size:.72rem}
.listrow .go{margin-left:auto;color:var(--ink2)}
.switch{margin-left:auto;width:46px;height:26px;border-radius:999px;background:var(--cream2);position:relative;flex:none;transition:background .2s}
.switch.on{background:var(--sage)}
.switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch.on:after{left:23px}
.notice{background:var(--sage-soft);border-radius:14px;padding:14px 16px;font-size:.78rem;line-height:1.55;color:#43513C;margin-top:16px}
.notice b{display:block;margin-bottom:2px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinrow{display:flex;gap:14px;justify-content:center;margin:26px 0}
.pinrow .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2)}
.pinrow .dot.f{background:var(--ink);border-color:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:260px;margin:0 auto}
.pinpad button{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.3rem;font-family:var(--serif);cursor:pointer}
.pinpad button:active{background:var(--cream2)}
.bigsize{display:flex;align-items:flex-end;justify-content:center;height:130px;margin:10px 0}
.letter{background:linear-gradient(150deg,#FFFDF6,#F8EFDD);border:1px solid var(--line);border-radius:20px;padding:24px;position:relative;margin-top:16px}
.letter .wax{width:44px;height:44px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.1rem;position:absolute;top:-14px;right:22px;box-shadow:0 4px 12px rgba(196,103,63,.4)}
.progressbar{height:6px;border-radius:99px;background:var(--cream2);overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;background:var(--terra);border-radius:99px}
body.care .progressbar i{background:var(--sage)}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mood{font-size:1.4rem;padding:8px;border-radius:14px;border:1px solid transparent;cursor:pointer}
.mood.on{border-color:var(--terra);background:var(--paper)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:999px;font-size:.82rem;z-index:99;animation:fade .3s;white-space:nowrap}
.film{position:fixed;inset:0;background:#0F0D0A;color:#EFE7D6;z-index:200;display:flex;flex-direction:column;animation:fade .5s ease}
.fprog{display:flex;gap:6px;padding:18px 20px 0}
.fprog i{flex:1;height:3px;border-radius:99px;background:rgba(239,231,214,.18)}
.fprog i.done{background:var(--gold)}
.fprog i.cur{background:var(--terra-soft)}
.fclose{position:absolute;top:44px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(239,231,214,.25);background:none;color:#EFE7D6;font-size:.9rem;cursor:pointer;z-index:2}
.fbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 30px;max-width:520px;margin:0 auto;width:100%;animation:fade .6s ease}
.fk{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.fbody h1{font-size:2.2rem;font-weight:300;line-height:1.15;margin-top:12px}
.fbody h1 em{color:var(--terra-soft)}
.fbody p{font-size:.95rem;line-height:1.8;color:#CFC4AE;margin-top:16px;font-weight:300}
.fshots{display:flex;gap:10px;margin-top:22px;overflow-x:auto;scrollbar-width:none}
.fshots::-webkit-scrollbar{display:none}
.fshots img{height:170px;border-radius:14px;flex:none}
.fctl{display:flex;justify-content:center;gap:14px;padding:0 0 34px}
.fctl button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(239,231,214,.25);background:rgba(239,231,214,.06);color:#EFE7D6;font-size:1.05rem;cursor:pointer}
.sharechip{font-size:.62rem;padding:4px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--ink2)}
.empty .big{font-size:2.6rem;margin-bottom:10px}
.empty p{font-size:.85rem;line-height:1.6;max-width:260px;margin:0 auto}
.header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.header .back{background:var(--paper);border:1px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer;flex:none;color:var(--ink)}
.header h2{font-size:1.35rem;font-weight:500}
</style>

const WEEKS=[
null,null,null,null,
["poppy seed","The cells that will become the baby are dividing and the placenta is beginning to form.","This is usually the week a missed period makes you wonder. A home test can already show a result."],
["sesame seed","The neural tube - which becomes the brain and spinal cord - is forming.","Folic acid matters most right now. 400 micrograms daily is the standard advice."],
["lentil","The heart has started to beat. Tiny buds appear that will become arms and legs.","Early pregnancy tiredness is real and hormonally driven. Rest is not laziness."],
["blueberry","Fingers and toes are beginning to form. The embryo is about 10,000 times bigger than at conception.","Nausea often peaks around now. Small, frequent snacks and ginger help many people."],
["raspberry","The face is taking shape - eyes, nostrils, a mouth. Internal organs are growing fast.","Time to book your first midwife or doctor appointment if you haven't."],
["cherry","Ears, teeth and the palate are forming. The baby can make small movements, though you can't feel them yet.","Some foods move to the avoid list: unpasteurised cheese, raw eggs, high-mercury fish."],
["strawberry","All essential organs exist. The baby is officially called a fetus from around now.","Your blood volume is rising, which is why you may feel warmer and thirstier."],
["lime","The baby is moving constantly now, even though you still can't feel it.","The dating scan is usually offered around weeks 11-14 - the first time you may see the baby."],
["plum","The baby can open and close its fists. Reflexes are developing.","If you've had the scan, this is often when the secret starts to feel real."],
["lemon","Tiny nails are forming on fingers and toes. The baby is fully formed in miniature.","Many people start sharing the news now, as the highest-risk window passes."],
["peach","The baby is kicking and stretching. You might feel flutters soon, especially if this isn't your first.","Appetite often returns as nausea eases. Protein, iron and calcium are the priorities."],
["apple","The baby can suck its thumb. The intestines, which were in the cord, move into the abdomen.","Energy often comes back around now - the famous second-trimester lift."],
["avocado","The baby is starting to produce urine and swallow amniotic fluid.","Round-ligament pain - a stitch-like ache on one side - is common and usually harmless."],
["pear","The baby can squint, frown and grimace. Fine hair (lanugo) covers the body.","Feeling the first movements - 'quickening' - often happens between weeks 16 and 20."],
["bell pepper","The baby is practicing breathing movements. The ears are nearly in their final position.","The anatomy scan, usually around week 20, checks the baby's development in detail."],
["mango","Vernix, a creamy protective coating, covers the baby's skin. The senses are developing.","Writing down the first kicks is worth it - the dates blur later."],
["banana","The baby is putting on fat and can probably hear muffled sounds from outside.","Talking, singing and reading to the bump genuinely registers now."],
["carrot","The baby's hearing is improving. Loud noises can startle them.","Sleeping on your side from around the third trimester is the standard advice."],
["papaya","A regular sleep-wake pattern is emerging. The kicks are unmistakable now.","Track patterns, not counts-by-the-hour - you'll learn your baby's normal."],
["grapefruit","Eyebrows and eyelashes are visible. The baby weighs about a pound.","Heartburn is common - small meals and an extra pillow at night help."],
["ear of corn","The baby's eyes can open. The lungs are practicing but aren't ready yet.","The whooping cough vaccine is recommended in pregnancy - usually from week 16 to 32."],
["head of lettuce","The brain is growing rapidly. The baby grips the umbilical cord sometimes.","Braxton Hicks - practice tightenings - can start now. They should ease with rest."],
["spring onion","Buds for adult teeth are forming. The baby is listening and can recognise voices.","This is a good week to start a shortlist of names and see how they feel out loud."],
["aubergine","The lungs are developing surfactant, which they will need to breathe air.","Baby hiccups feel like tiny rhythmic pulses - completely normal."],
["coconut","The nostrils are opening. The baby has a firm grasp.","Start thinking about the birth preferences sheet - a page, not a novel."],
["butternut squash","The spine has around 1,000 ligaments now. The baby can recognise your voice at birth.","Antenatal classes usually start around weeks 30-32 - worth booking early."],
["cabbage","The baby is dreaming - REM sleep has been measured. The brain is very active.","Kicks should feel strong and regular. Any reduction in movement is a call to your midwife, always."],
["pineapple","The baby can turn towards light. Eyes can open and close.","Pack ideas for the hospital bag around now - it removes one whole category of worry."],
["coconut palm melon","The bones are fully formed but still soft. Space in there is getting tight.","Practice contractions may get stronger. Timing them teaches you the difference."],
["honeydew","The baby can process more information and respond to sounds with movement.","Colostrum - the first milk - may start to leak. Normal, and a sign the body is preparing."],
["cantaloupe","Most babies have moved head-down by now, or soon will.","The birth partner bag matters too: snacks, chargers, a change of clothes."],
["romaine lettuce","The central nervous system and lungs are maturing fast.","Slow down in earnest now. The to-do list can genuinely wait."],
["bunch of celery","The baby is gaining about an ounce a day. Fat is rounding out the cheeks.","Keep the hospital route and the petrol tank sorted. Do a dry run."],
["small pumpkin","The baby's kidneys are fully developed. The liver can process some waste.","Wash the tiny clothes. It makes the whole thing feel beautifully real."],
["watermelon","The baby is considered full-term from week 39. Mostly now, they wait with you.","Any time now means any time in the next few weeks. Rest while you can."],
["small watermelon","Full term. The baby is ready - and so, somehow, are you.","Trust the patterns you know: movements, your body, and your midwife's number."],
["newborn","The longest wait. The baby is fully cooked and simply choosing their moment.","One day very soon, this whole page becomes the first chapter of their story."]
